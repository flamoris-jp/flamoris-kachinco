name: Windows portable package
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained editor and bridge
        shell: pwsh
        run: ./product/packaging/publish-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Kachinco-win-x64
          path: artifacts/windows/Kachinco-win-x64.zip
