name: Windows portable package
on: workflow_dispatch
permissions:
  contents: read
env:
  FlamorisMcpSourceRoot: ${{ github.workspace }}/.mcp-core

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout MCP Core candidate for cross-repository validation
        uses: actions/checkout@v4
        with:
          repository: flamoris-jp/flamoris-mcp-core
          ref: 87f654d6c4579c21e2267554236ae3ce1bbe5a1c
          path: .mcp-core
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained editor and bridge
        shell: pwsh
        run: ./product/packaging/publish-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Kachinco-win-x64
          path: artifacts/windows/Kachinco-win-x64.zip
          retention-days: 3
