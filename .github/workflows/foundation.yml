name: Product
on:
  push:
    branches-ignore: [main]
    paths: ['product/**', 'test/**', 'Directory.Build.props', 'global.json', 'Kachinco.slnx', 'NuGet.config', 'appsettings.json', 'staging/windows-production.md', 'docs/windows-packaging.md', '.github/workflows/windows-package.yml', '.github/workflows/foundation.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  headless-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Native memory and undefined-behavior contracts
        run: |
          cmake -S product/native -B artifacts/native-sanitized -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_C_FLAGS="-fsanitize=address,undefined" -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build artifacts/native-sanitized --parallel 2
          ctest --test-dir artifacts/native-sanitized --output-on-failure
      - name: Ensure ffprobe test dependency
        run: command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: dotnet test test/Kachinco.Tests/Kachinco.Tests.csproj -c Release --logger "trx;LogFileName=product.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-test-results
          path: test/Kachinco.Tests/TestResults/*.trx
          retention-days: 3
  windows-shell:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure Windows FFmpeg fixture dependency
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg --no-progress -y }
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + $env:Path
          $env:Path | Out-File -FilePath $env:GITHUB_PATH -Append
          ffmpeg -version
      - run: dotnet build Kachinco.slnx -c Release
      - name: Windows managed-native ABI parity
        run: dotnet test test/Kachinco.Tests/Kachinco.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~NativeRuntimeTests|FullyQualifiedName~NativeMediaTests|FullyQualifiedName~NativeRenderingTests|FullyQualifiedName~NativeTimelineTests|FullyQualifiedName~NativeEditingTests|FullyQualifiedName~GpuDecodeTests|FullyQualifiedName~PreviewBackendTests|FullyQualifiedName~NativeGpuPreviewTests"
      - name: Windows worker and raster acceptance
        run: dotnet run --project test/Kachinco.WindowsSmoke/Kachinco.WindowsSmoke.csproj -c Release --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interactive-preview-evidence
          path: |
            artifacts/interactive-preview-metrics.json
            artifacts/inspector-properties.png
            artifacts/volume-automation.png
            artifacts/effect-library.png
          retention-days: 3
      - name: Portable archive integrity contracts
        shell: pwsh
        run: ./test/packaging/portable-package.Tests.ps1
      - name: Portable publish smoke
        shell: pwsh
        run: ./product/packaging/publish-windows.ps1
      - name: Published editor and bridge external MCP acceptance
        run: dotnet run --project test/Kachinco.WindowsSmoke/Kachinco.WindowsSmoke.csproj -c Release --no-build -- --packaged artifacts/windows/FLAMORIS-Kachinco-win-x64
      - name: Launch shell smoke
        shell: pwsh
        run: |
          $app = Resolve-Path 'artifacts/windows/FLAMORIS-Kachinco-win-x64/Kachinco.App.exe'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $process = Start-Process $app -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Shell exited with $($process.ExitCode)" }
              if ($process.MainWindowHandle -ne 0) { $ready = $true; break }
            }
            if (-not $ready) { throw 'Shell did not create its main window.' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Upload accepted portable package
        uses: actions/upload-artifact@v4
        with:
          name: FLAMORIS-Kachinco-win-x64
          path: |
            artifacts/windows/FLAMORIS-Kachinco-win-x64.zip
            artifacts/windows/FLAMORIS-Kachinco-win-x64.inventory.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
